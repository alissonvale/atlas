version: "1.0.0"
kind: hygiatech_ticket_model

purpose: >
  Define o modelo canônico dos tickets sintéticos da HygiaTech antes da geração
  dos lotes de simulação. Este arquivo descreve campos, eventos, estados e
  relações esperadas. Ele não contém tickets reais.

entities:
  ticket:
    description: demanda operacional recebida pela HygiaTech e eventualmente classificada pelo Atlas
    required_fields:
      - id
      - title
      - hospital_id
      - demand_type
      - module
      - opened_at
      - source
      - reported_by
      - description
      - perceived_urgency
      - operational_impact
      - affected_users
      - workaround_available
      - evidence_quality
      - initial_atlas_class
      - response_system
      - status
    optional_fields:
      - version
      - environment
      - primary_technology
      - assigned_team
      - assigned_staff
      - sle_policy
      - due_at
      - closed_at
      - customer_validated
      - recurrence_group
      - related_tickets
      - learning_review_id
      - s3_candidate_id

  ticket_event:
    description: evento temporal dentro do workflow do ticket
    required_fields:
      - id
      - ticket_id
      - occurred_at
      - event_type
      - actor_type
      - actor_id
      - summary
    optional_fields:
      - from_status
      - to_status
      - from_class
      - to_class
      - evidence
      - mirror_used
      - mirror_prompt_summary
      - notes

  triage_decision:
    description: decisão explícita de classificação Atlas
    required_fields:
      - id
      - ticket_id
      - decided_at
      - decided_by
      - atlas_class
      - response_system
      - justification
      - sle_policy
      - review_needed
    optional_fields:
      - uncertainty
      - review_at
      - rejected_classes
      - risk_evidence

  reclassification:
    description: mudança explícita de sistema quando a natureza de risco muda
    required_fields:
      - id
      - ticket_id
      - occurred_at
      - from_class
      - from_system
      - to_class
      - to_system
      - reason
      - new_evidence
      - decided_by
    optional_fields:
      - impact_on_cycle
      - previous_sle_status
      - follow_up_needed

  mirror_interaction:
    description: uso do Mirror por um papel da HygiaTech durante a operação
    required_fields:
      - id
      - ticket_id
      - occurred_at
      - actor_id
      - stage
      - purpose
      - output_summary
    optional_fields:
      - prompt_excerpt
      - memory_created
      - influenced_decision
      - related_event_id

status_catalog:
  pre_atlas:
    - new_signal
    - qualifying
    - awaiting_evidence
    - support_resolved

  s1:
    - s1_confirmed
    - mobilizing
    - containing
    - correcting
    - delivering
    - validating
    - closed

  s2:
    - s2_confirmed
    - prioritized
    - investigating
    - correcting
    - delivering
    - validating
    - closed

  s3:
    - s3_candidate
    - qualified
    - programmed
    - developing
    - testing
    - production
    - closed

  exceptional:
    - cancelled
    - duplicate
    - reclassified
    - waiting_customer
    - waiting_external_vendor

event_types:
  intake:
    - ticket_opened
    - evidence_requested
    - evidence_received
    - help_desk_summary_created

  triage:
    - triage_started
    - triage_decided
    - classification_review_scheduled
    - reclassified

  execution:
    - assigned
    - investigation_started
    - hypothesis_recorded
    - workaround_applied
    - fix_started
    - fix_completed
    - script_prepared
    - script_executed
    - deploy_started
    - deploy_completed

  communication:
    - customer_update_sent
    - customer_waiting
    - customer_validation_requested
    - customer_validated

  learning:
    - cause_recorded
    - recurrence_detected
    - s3_candidate_created
    - learning_review_created
    - closed

field_definitions:
  id:
    type: string
    example: TCK-2026-0001
    note: identificador único do ticket sintético

  hospital_id:
    type: reference
    references: simulation/data/hospitals.yaml:hospitals.id
    example: HOS-001

  demand_type:
    type: reference
    references: simulation/data/demand-types.yaml:demand_types.slug
    example: defeito_bloqueante

  module:
    type: reference
    references: simulation/data/modules.yaml:modules.slug
    example: faturamento

  opened_at:
    type: datetime
    example: "2026-06-01T09:15:00-03:00"

  source:
    type: enum
    values:
      - telefone
      - email
      - portal
      - monitoramento
      - executivo_cliente
      - interno_hygiatech

  perceived_urgency:
    type: enum
    values:
      - baixa
      - media
      - alta
      - critica
    note: urgência declarada ou percebida, não classificação Atlas

  operational_impact:
    type: enum
    values:
      - nenhum
      - incomodo
      - retrabalho
      - operação_comprometida
      - operação_bloqueada
      - perda_imediata

  affected_users:
    type: enum
    values:
      - usuario_unico
      - poucos_usuarios
      - setor
      - multiplos_setores
      - hospital_inteiro

  workaround_available:
    type: enum
    values:
      - sim
      - parcial
      - nao
      - desconhecido

  evidence_quality:
    type: enum
    values:
      - baixa
      - media
      - alta

  initial_atlas_class:
    type: enum
    values:
      - R1
      - R2
      - R3
      - incerta
      - suporte_sem_atlas

  response_system:
    type: enum
    values:
      - S1
      - S2
      - S3
      - suporte
      - incerto

  primary_technology:
    type: enum
    values:
      - delphi_2007_datasnap
      - delphi_seattle
      - csharp_api
      - infraestrutura
      - dados
      - desconhecida

  status:
    type: enum
    values_source: status_catalog

  mirror_stage:
    type: enum
    values:
      - chegada
      - qualificacao
      - triagem
      - investigacao
      - correcao
      - comunicacao
      - fechamento
      - aprendizado

sle_measurement:
  s1_s2_stage_timestamps:
    - chegada
    - identificacao
    - reacao
    - correcao
    - entrega
  derived_times:
    - wait_time
    - touch_time
    - lead_time
    - time_to_identification
    - time_to_reaction
    - time_to_correction
    - time_to_delivery
  outcome:
    - sle_in
    - sle_out
    - not_applicable

simulation_rules:
  - perceived_urgency must not be treated as initial_atlas_class without triage evidence
  - R1 tickets should have no viable workaround or immediate loss evidence
  - R2 tickets should have real operational impact but not necessarily immediate loss
  - R3 tickets should be programable unless a deadline or new evidence changes risk
  - every reclassification must reference new_evidence
  - every SLE miss should record the stage where time was consumed
  - recurring S1 or S2 patterns should be eligible to create S3 candidates
  - Mirror interactions should be recorded as operational support, not as authoritative decision by themselves

example_ticket:
  id: TCK-2026-0001
  title: Faturamento de convênio não fecha no Hospital São Gabriel
  hospital_id: HOS-001
  demand_type: defeito_bloqueante
  module: faturamento
  opened_at: "2026-06-01T09:15:00-03:00"
  source: telefone
  reported_by: supervisora de faturamento
  description: Ao tentar fechar o lote do convênio principal, o sistema retorna erro e impede continuidade.
  perceived_urgency: critica
  operational_impact: operação_bloqueada
  affected_users: setor
  workaround_available: nao
  evidence_quality: media
  initial_atlas_class: R2
  response_system: S2
  status: s2_confirmed
  version: "7.14.3"
  environment: produção
  primary_technology: delphi_2007_datasnap
  assigned_team: delphi_core
  sle_policy: S2

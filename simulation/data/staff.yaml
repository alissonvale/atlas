version: "1.0.0"
kind: hygiatech_staff

teams:
  - id: TEAM-001
    slug: help_desk
    name: Help Desk
    size: 8
    role_in_atlas: chegada e qualificação inicial das demandas
    responsibilities:
      - registrar demanda com evidência mínima
      - identificar cliente, módulo, versão e ambiente
      - separar dúvida, incidente, defeito e melhoria
      - descrever impacto operacional percebido
      - acionar gatekeeper quando houver risco operacional
      - comunicar retorno inicial ao cliente
    constraints:
      - pressão direta dos hospitais durante incidentes
      - qualidade variável de evidências recebidas
      - risco de aceitar urgência percebida como prioridade real
    mirror_usage:
      - organizar relato do cliente
      - formular perguntas de evidência mínima
      - preparar resumo para triagem
      - sugerir comunicação inicial ao cliente

  - id: TEAM-002
    slug: delphi_core
    name: Desenvolvimento Delphi Core
    size: 3
    role_in_atlas: correção e investigação do core legado Delphi 2007/DataSnap
    responsibilities:
      - investigar incidentes no client/server Delphi
      - corrigir defeitos no core legado
      - avaliar risco de correções emergenciais
      - apoiar triagem técnica de S1 e S2
      - registrar causas prováveis e contornos
    constraints:
      - gargalo principal da sustentação
      - alto acoplamento legado
      - baixa disponibilidade para S3 quando S1/S2 invadem a agenda
      - dependência de conhecimento tácito
    mirror_usage:
      - reconstruir contexto operacional antes da correção
      - explicitar hipótese técnica
      - registrar risco de alteração
      - transformar recorrências em candidatos S3

  - id: TEAM-003
    slug: csharp_api
    name: Desenvolvimento C# API
    size: 2
    role_in_atlas: sustentação de backend/API e integrações
    responsibilities:
      - investigar falhas em APIs e integrações
      - corrigir serviços C#
      - separar falha interna de indisponibilidade externa
      - apoiar observabilidade e logs
      - conectar eventos técnicos com impacto operacional
    constraints:
      - menor volume de demanda que Delphi
      - alta criticidade em integrações específicas
      - dependência de contratos externos
      - visibilidade incompleta quando o erro nasce no core Delphi
    mirror_usage:
      - analisar logs e hipóteses de integração
      - explicar impacto técnico para gatekeeper
      - documentar contratos e falhas recorrentes
      - propor melhorias de observabilidade

  - id: TEAM-004
    slug: sustentacao
    name: Coordenação de Sustentação
    size: 1
    role_in_atlas: governança do fluxo, revisão de SLE e aprendizado operacional
    responsibilities:
      - acompanhar S1 e S2 ativos
      - revisar DDP e causas de atraso
      - proteger capacidade técnica
      - conduzir revisão semanal de fluxo
      - decidir ajustes de processo com produto e tecnologia
      - garantir que aprendizados virem ação
    constraints:
      - precisa equilibrar pressão comercial, operação hospitalar e capacidade real
      - risco de centralização excessiva no gatekeeper
      - precisa tornar visível a invasão de S3 por urgências
    mirror_usage:
      - preparar SLE Pulse
      - conduzir Learning Review
      - interpretar gargalos por tecnologia
      - registrar decisões operacionais

  - id: TEAM-005
    slug: produto
    name: Produto e Negócio
    size: 1
    role_in_atlas: seleção e priorização de S3, fronteira entre sustentação e evolução
    responsibilities:
      - priorizar adaptações de S3
      - avaliar valor multi-cliente
      - separar melhoria de sustentação de nova capacidade de produto
      - revisar recorrências que apontam para decisão de produto
      - alinhar comunicação com clientes estratégicos
    constraints:
      - pressão por customizações específicas de hospitais
      - risco de transformar S3 em fila genérica de pedidos
      - necessidade de proteger roadmap de produto sem abandonar sustentação
    mirror_usage:
      - comparar demandas recorrentes
      - identificar padrões multi-cliente
      - preparar programação S3
      - registrar decisões de escopo e não escopo


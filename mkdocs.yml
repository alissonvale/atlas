site_name: Atlas
site_description: Framework de gestão para sustentação de produtos de software.
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
nav:
  - Início: index.md
  - Framework:
      - method/index.md
      - Visão geral: method/overview.md
      - Modelo conceitual: method/conceptual-model.md
      - Princípios: method/principles.md
      - Sistemas de resposta: method/response-systems.md
      - Workflows das demandas: method/workflows.md
      - Gramática visual: method/visual-grammar.md
      - Triagem e gatekeeper: method/triage-and-gatekeeper.md
      - Métricas e sinais de saúde: method/metrics.md
      - Papéis: method/roles.md
      - Sustentação e desenvolvimento: method/sustaining-vs-development.md
  - Operação:
      - operations/index.md
      - Cadências e políticas: operations/cadences-and-policies.md
  - Simulação:
      - simulation/index.md
      - Modelo de dados: simulation/data-model.md
      - Runbook: simulation/runbook.md
      - Semana atual: simulation/current-week.md
      - Design de fluxo operacional: simulation/operational-flow-design.md
      - Revisão mensal: simulation/monthly-review.md
      - Uso do Mirror HygiaTech: simulation/mirror-usage.md
      - Roteiro de instalação Mirror: simulation/mirror-installation-runbook.md
  - Adoção:
      - adoption/index.md
      - Guia de adoção: adoption/guide.md
  - Projeto:
      - Briefing: project/briefing.md
      - Roadmap: project/roadmap/index.md
  - Anexos:
      - attachments/index.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
